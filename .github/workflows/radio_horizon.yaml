name: radio_horizon

on:
  pull_request:
    paths:
      - ".github/workflows/radio_horizon.yaml"
      - "lib/**"
      - "test/**"
      - "bin/**"
      - "activity/**"
      - "pubspec.yaml"
      - "Dockerfile"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/radio_horizon.yaml"
      - "lib/**"
      - "test/**"
      - "bin/**"
      - "activity/**"
      - "pubspec.yaml"
      - "Dockerfile"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: ./.github/workflows/dart_package.yaml
    with:
      min_coverage: 0
      analyze_directories: lib bin

  activity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json

      - name: 📦 Install Activity dependencies
        run: npm ci

      - name: 🏗️ Build Activity
        run: npm run build

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: |
          dart pub get
