server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    password: null # pragma: allowlist secret
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    # The duration of the NAS buffer. Higher values fare better against
    # longer GC pauses. Minimum of 40ms, lower values may introduce pauses.
    bufferDurationMs: 1000
    # How many milliseconds of audio to keep buffered
    frameBufferDurationMs: 5000
    # Opus encoder quality. Valid values range from 0 to 10, where 10 is best 
    # quality but is the most expensive on the CPU.
    opusEncodingQuality: 10
    # Quality of resampling operations. Valid values are LOW, MEDIUM and HIGH,
    # where HIGH uses the most CPU.
    resamplingQuality: MEDIUM
    # The threshold for how long a track can be stuck. A track is stuck if does
    # not return any audio data.
    trackStuckThresholdMs: 10000
    # Seek ghosting is the effect where whilst a seek is in progress, the audio
    # buffer is read from until empty, or until seek is ready.
    useSeekGhosting: true
    # Number of pages at 100 each
    youtubePlaylistLoadLimit: 10
    # How frequently to send player updates to clients, in seconds
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
  plugins:
    # 1.18.2 still uses a Cobalt TV user-agent that YouTube rejects with
    # "The page needs to be reloaded." This snapshot includes the PS4 UA
    # fix (#233) so OAuth TV playback can get stream URLs again.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

plugins:
  youtube:
    enabled: true
    allowSearch: true
    # Whether just video IDs can match. If false, only complete URLs 
    # will be loaded.
    allowDirectVideoIds: true
    # Whether just playlist IDs can match. If false, only complete URLs
    # will be loaded.
    allowDirectPlaylistIds: true
    # Clients are queried in order. MUSIC is search-only. WEB is for
    # ytsearch metadata only (SABR has no playable URLs). TV+OAuth is the
    # playback path that works from this host after the PS4 UA fix.
    clients:
      - MUSIC
      - WEB
      - MWEB
      - TV
      - IOS
      - ANDROID_MUSIC
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEBEMBEDDED
    clientOptions:
      WEB:
        playback: false
      WEBEMBEDDED:
        playback: false
      IOS:
        searching: false
    oauth:
      enabled: true
      refreshToken: null
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "radio-horizon"
  lavasrc:
    providers:
      - "dzisrc:%ISRC%"
      - "dzsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
    deezer:
      # Injected by update_lavalink_config from DEEZER_MASTER_DECRYPTION_KEY.
      masterDecryptionKey: null
      # Injected by update_lavalink_config from DEEZER_ARL.
      # LavaSrc 4.8 requires a non-empty ARL to enable Deezer.
      arl: null
      formats: [ "MP3_128", "MP3_64" ]
    youtube:
      countryCode: "US"
