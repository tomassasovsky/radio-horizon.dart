services:
  radio_horizon:
    build:
      context: .
      args:
          dart_entryfile: radio_horizon_development.dart
    container_name: radio_horizon
    expose:
      - 8080
    env_file:
     - .env/.env.development
    environment:
      MONGO_CONNECTION: mongodb://root:example@mongo:27017/radio_horizon?authSource=admin
    links:
      - lavalink
      - shazam_api
      - mongo
    depends_on:
      - lavalink
      - shazam_api
      - mongo

  update_lavalink_config:
    build:
      context: ./update_lavalink_config
    container_name: update_lavalink_config
    volumes:
      - ./lavalink.yml:/app/lavalink.yml:ro
      - ./:/output-dir
    env_file:
      - .env/.env.development
    command: ["--input", "/app/lavalink.yml", "--output", "/output-dir/output.lavalink.yml", "--env", "development"]

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: always
    expose:
      - 2333
    volumes:
      - ./output.lavalink.yml:/opt/Lavalink/application.yml
    depends_on:
      update_lavalink_config:
        condition: service_completed_successfully

  shazam_api:
    build:
      context: ./shazam_api
    expose:
      - 5000
    environment:
      FLASK_ENV: development

  mongo:
    image: mongo:8.3.11
    container_name: mongo
    restart: always
    ports:
      - 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=radio_horizon
