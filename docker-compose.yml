services:
  radio_horizon:
    build:
      context: .
      args:
          dart_entryfile: radio_horizon_development.dart
    container_name: radio_horizon
    expose:
      - 8080
    env_file:
     - .env/.env.development
    links:
      - lavalink
      - shazam_api
      - mongo
    depends_on:
      - lavalink
      - shazam_api
      - mongo

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: always
    expose:
      - 2333
    volumes:
     - ./output.lavalink.yml:/opt/Lavalink/application.yml

  shazam_api:
    build:
      context: ./shazam_api
    expose:
      - 5000
    environment:
      FLASK_ENV: development

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=radio_horizon
